<!DOCTYPE html>
<html>
<body>
    <h2>Inserimento dati personali</h2>
    <form onsubmit="stampaDati(); return false;">

        Nome:
        <input type="text" id="nome">
        <br><br>

        Cognome:
        <input type="text" id="cognome">
        <br><br>

        Età:
        <input type="number" id="eta">
        <br><br>

        Sesso:
        <input type="radio" id="sessoM" name="sesso" value="Maschio"> Maschio
        <input type="radio" id="sessoF" name="sesso" value="Femmina"> Femmina
        <br><br>

        Indirizzo:
        <input type="text" id="indirizzo">
        <br><br>

        Città:
        <input type="text" id="citta">
        <br><br>

        Provincia:
        <select id="provincia">
            <option value="">Seleziona una provincia</option>
            <option value="Milano">Milano</option>
            <option value="Roma">Roma</option>
            <option value="Torino">Torino</option>
            <option value="Napoli">Napoli</option>
            <option value="Bergamo">Bergamo</option>
            <option value="Brescia">Brescia</option>
            <option value="Como">Como</option>
        </select>
        <br><br>

        Sport praticati:
        <br>
        <input type="checkbox" name="sport" value="Calcio"> Calcio
        <input type="checkbox" name="sport" value="Basket"> Basket
        <input type="checkbox" name="sport" value="Nuoto"> Nuoto
        <input type="checkbox" name="sport" value="Tennis"> Tennis
        <br><br>

        Commenti:
        <br>
        <textarea id="commenti" rows="5" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Stampa dati">

    </form>

    <hr>

    <h2>Dati inseriti</h2>

    <table border="1" id="tabella">
        <tr>
            <th>Campo</th>
            <th>Valore</th>
        </tr>
    </table>

    <script>
        function stampaDati() {
            let nome = document.getElementById("nome").value;
            let cognome = document.getElementById("cognome").value;
            let eta = document.getElementById("eta").value;
            let indirizzo = document.getElementById("indirizzo").value;
            let citta = document.getElementById("citta").value;
            let provincia = document.getElementById("provincia").value;
            let commenti = document.getElementById("commenti").value;

            let sessoMaschio = document.getElementById("sessoM");
            let sessoFemmina = document.getElementById("sessoF");

            let sesso = "";
            if (sessoMaschio.checked)
                sesso = sessoMaschio.value;
            else if (sessoFemmina.checked)
                sesso = sessoFemmina.value;

            let sportSelezionati = document.getElementsByName("sport");
            let sport = "";

            for (let i = 0; i < sportSelezionati.length; i++) {
                if (sportSelezionati[i].checked)
                    sport = sport + sportSelezionati[i].value + " ";
            }

            if (sport == "")
                sport = "Nessuno";

            if (sport == "")
                sport = "Nessuno";

            let tabella = document.getElementById("tabella");
            tabella.innerHTML = "";

            let intestazione = tabella.insertRow();

            intestazione.insertCell().textContent = "Campo";
            intestazione.insertCell().textContent = "Valore";

            function aggiungiRiga(campo, valore) {
                let riga = tabella.insertRow();

                let cella1 = riga.insertCell();
                let cella2 = riga.insertCell();

                cella1.textContent = campo;
                cella2.textContent = valore;
            }

            aggiungiRiga("Nome", nome);
            aggiungiRiga("Cognome", cognome);
            aggiungiRiga("Età", eta);
            aggiungiRiga("Sesso", sesso);
            aggiungiRiga("Indirizzo", indirizzo);
            aggiungiRiga("Città", citta);
            aggiungiRiga("Provincia", provincia);
            aggiungiRiga("Sport praticati", sport);
            aggiungiRiga("Commenti", commenti);
        }
    </script>
</body>
</html>
